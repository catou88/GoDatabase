name: PR Conventions

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-conventions-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate PR title and linked issue
    runs-on: ubuntu-latest

    steps:
      - name: Validate PR conventions
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const pr = context.payload.pull_request;
            const author = pr.user?.login || '';
            const isDependabot = author === 'dependabot[bot]';
            const humanTitlePattern = /^(feat|fix|docs|test|ci|refactor|perf|chore|build|revert)(\([a-z0-9-]+\))?: .{1,72}$/;
            const dependabotTitlePattern = /^chore\(deps\): .{1,120}$/;
            const linkedIssuePattern = /\b(close[sd]?|fix(e[sd])?|resolve[sd]?)\s+#\d+\b/i;

            const errors = [];
            let title = pr.title;

            if (isDependabot && !dependabotTitlePattern.test(title)) {
              title = title.replace(/^Bump\b/i, 'bump');
              title = title.replace(/\s+/g, ' ').trim();
              title = `chore(deps): ${title}`;

              if (title.length > 120) {
                title = title.slice(0, 117).trimEnd() + '...';
              }

              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                title,
              });

              core.info(`Updated Dependabot PR title to: ${title}`);
            }

            const validTitle = isDependabot
              ? dependabotTitlePattern.test(title)
              : humanTitlePattern.test(title);

            if (!validTitle) {
              errors.push(
                'PR title must use Conventional Commits, for example: `feat(btree): add node search` or `chore(deps): bump actions/checkout`.'
              );
            }

            if (!isDependabot && !linkedIssuePattern.test(pr.body || '')) {
              errors.push(
                'PR body must link an issue with a closing keyword, for example: `Closes #12`.'
              );
            }

            if (errors.length > 0) {
              core.setFailed(errors.join('\n'));
            }
